<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nerdeyiz?</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1b;--muted:#6b6a66;--accent:#d9480f;--line:#e4e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--text:#f2efe8;--muted:#9d9a92;--accent:#ff8a4c;--line:#34312d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:420px;text-align:center}
h1{margin:0 0 6px;font-size:28px}
p.sub{margin:0 0 24px;color:var(--muted);font-size:15px}
button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:wait}
#out{margin-top:24px;display:none;text-align:left}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:16px}
#msg{margin-top:18px;color:var(--muted);font-size:14px;min-height:18px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9480f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nerdeyiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div class="card">
  <h1>📍 Nerdeyiz?</h1>
  <p class="sub">Konumunu paylaş, nerede olduğunu söyleyelim.</p>
  <button id="btn">Konumumu Bul</button>
  <div id="msg"></div>
  <div id="out">
    <div class="row"><span>Bölge</span><span id="alt">–</span></div>
    <div class="row"><span>İlçe</span><span id="ilce">–</span></div>
    <div class="row"><span>İl</span><span id="il">–</span></div>
    <div class="row"><span>Ülke</span><span id="ulke">–</span></div>
    <div class="row"><span>Enlem</span><span id="lat">–</span></div>
    <div class="row"><span>Boylam</span><span id="lon">–</span></div>
    <div class="row"><span>Doğruluk</span><span id="acc">–</span></div>
    <button id="copy" class="ghost">Koordinatları Kopyala</button>
  </div>
</div>
<script>
const btn=document.getElementById('btn'),msg=document.getElementById('msg'),out=document.getElementById('out');
let last='';
function set(id,v){document.getElementById(id).textContent=v||'–'}
btn.addEventListener('click',()=>{
  if(!navigator.geolocation){msg.textContent='Tarayıcın konum özelliğini desteklemiyor.';return}
  btn.disabled=true;out.style.display='none';msg.textContent='Konum alınıyor…';
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      msg.textContent='Adres çözümleniyor…';
      const {latitude:la,longitude:lo}=pos.coords;
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=tr&lat=${la}&lon=${lo}`);
      if(!r.ok)throw new Error('http '+r.status);
      const a=(await r.json()).address||{};
      const il=a.province||a.state||a.city||'';
      const ilce=a.town||a.county||a.city_district||a.suburb||(a.city&&a.city!==il?a.city:'')||'';
      const koy=a.village||a.hamlet||'';
      let alt=koy||a.neighbourhood||a.quarter||a.suburb||'';
      if(alt===ilce||alt===il)alt=koy||a.neighbourhood||a.quarter||'';
      set('alt',alt);set('ilce',ilce);set('il',il);set('ulke',a.country);
      last=la.toFixed(6)+', '+lo.toFixed(6);
      set('lat',la.toFixed(6));set('lon',lo.toFixed(6));
      set('acc',pos.coords.accuracy?'±'+Math.round(pos.coords.accuracy)+' m':'');
      out.style.display='block';msg.textContent='';
    }catch(e){msg.textContent='Adres bilgisi alınamadı. İnternet bağlantını kontrol edip tekrar dene.'}
    btn.disabled=false;
  },err=>{
    const t={1:'Konum izni verilmedi. Tarayıcı ayarlarından izin verip tekrar dene.',2:'Konum belirlenemedi.',3:'Konum isteği zaman aşımına uğradı.'};
    msg.textContent=t[err.code]||'Bir hata oluştu.';btn.disabled=false;
  },{enableHighAccuracy:false,timeout:15000,maximumAge:60000});
});
document.getElementById('copy').addEventListener('click',async e=>{
  const b=e.currentTarget;
  try{await navigator.clipboard.writeText(last);b.textContent='Kopyalandı ✓'}catch(_){b.textContent='Kopyalanamadı'}
  setTimeout(()=>b.textContent='Koordinatları Kopyala',1800);
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
